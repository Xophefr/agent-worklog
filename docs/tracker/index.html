<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chantiers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%233538cd%27 stroke-width=%272.4%27 stroke-linecap=%27round%27%3E%3Cpath d=%27M9 6h11M9 12h11M9 18h11%27/%3E%3Cpath d=%27M4 6l1 1 2-2M4 12l1 1 2-2%27/%3E%3Ccircle cx=%275%27 cy=%2718%27 r=%271%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#view">Aller au contenu</a>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-grip" viewBox="0 0 24 24"><circle cx="9" cy="6" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
</svg>

<header class="top">
  <div class="brand">
    <nav class="crumbs" id="crumbs" aria-label="Projets" hidden></nav>
    <h1 id="appTitle">Chantiers</h1>
    <p class="sub" id="syncInfo">Chargement…</p>
  </div>
  <div class="top-actions">
    <span class="save-state" id="saveState" role="status" aria-live="polite"></span>
    <button class="icon-btn" id="exportBtn" type="button" aria-label="Exporter en Excel (.xlsx)" title="Exporter en Excel (.xlsx)"><svg aria-hidden="true"><use href="#i-download"/></svg></button>
    <button class="icon-btn only-base" id="reglagesBtn" type="button" aria-label="Réglages du projet" title="Réglages du projet"><svg aria-hidden="true"><use href="#i-gear"/></svg></button>
    <button class="icon-btn" id="reloadBtn" type="button" aria-label="Recharger les données"><svg aria-hidden="true"><use href="#i-refresh"/></svg></button>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Passer en thème sombre"><svg aria-hidden="true"><use href="#i-moon"/></svg></button>
  </div>
</header>

<h2 class="sr">Indicateurs</h2>
<ul class="kpis" id="kpis"></ul>

<nav class="tabs" aria-label="Vues">
  <button type="button" data-view="prio" aria-pressed="true">Priorisation</button>
  <button type="button" data-view="board" aria-pressed="false">Tableau</button>
  <button type="button" data-view="items" aria-pressed="false">Tâches</button>
  <button type="button" data-view="done" aria-pressed="false">Terminés &amp; clos</button>
  <button type="button" data-view="code" aria-pressed="false">Code</button>
  <button type="button" data-view="journal" aria-pressed="false" class="only-base">Journal</button>
</nav>

<div class="filters" id="filters" role="search" aria-label="Filtres">
  <button type="button" class="filters-btn" id="filtersBtn" aria-expanded="false">Filtres<span id="filtersN"></span></button>
  <label class="search"><svg aria-hidden="true"><use href="#i-search"/></svg><span class="sr">Rechercher</span>
    <input type="search" id="q" placeholder="Rechercher (id, titre, texte)…"></label>
  <label>Priorité <select id="fPrio"><option value="">Toutes</option><option>P0</option><option>P1</option><option>P2</option><option>P3</option></select></label>
  <label class="only-items">Domaine <select id="fDom"><option value="">Tous</option></select></label>
  <label class="only-items">Statut <select id="fStatut"><option value="">Tous</option></select></label>
  <label class="only-items large">Chantier <select id="fCh"><option value="">Tous</option><option value="__none">Sans chantier</option></select></label>
  <label class="only-items large">Lot <select id="fLot"><option value="">Tous</option></select></label>
  <label class="only-ch chk"><input type="checkbox" id="fAvecTaches"> Avec tâches seulement</label>
  <label class="only-items chk"><input type="checkbox" id="fDecision"> <span id="fDecisionLabel">Décision attendue</span></label>
</div>

<main id="view" tabindex="-1" aria-live="off"></main>

<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="drTitle">
  <div class="drawer-head">
    <div><span class="mono" id="drId"></span><h2 id="drTitle"></h2></div>
    <button class="icon-btn" id="drClose" type="button" aria-label="Fermer la fiche"><svg aria-hidden="true"><use href="#i-x"/></svg></button>
  </div>
  <div class="drawer-body" id="drBody"></div>
</div>
<div class="scrim" id="scrim" hidden></div>

<script src="xlsx.js"></script>
<script src="app.js"></script>
</body>
</html>
