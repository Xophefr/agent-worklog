<body class="accueil">
<a class="skip" href="#view">Aller au contenu</a>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></symbol>

<header class="top">
  <div class="brand">
    <h1>Mes projets</h1>

  </div>
  <div class="top-actions">
    <button class="icon-btn" id="reloadBtn" type="button" aria-label="Recharger"><svg aria-hidden="true"><use href="#i-refresh"/></svg></button>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Passer en thème sombre"><svg aria-hidden="true"><use href="#i-moon"/></svg></button>
  </div>
</header>

<main id="view" tabindex="-1">
  <ul class="projets" id="projets" aria-label="Projets"></ul>
</main>

<script src="accueil.js"></script>
